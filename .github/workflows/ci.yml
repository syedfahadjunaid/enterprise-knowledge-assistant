name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the workflow token
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (Python, FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # Unit tests plus integration tests against real Postgres + pgvector (Testcontainers uses
      # the runner's Docker): row-level security, the worker, the API and the permission eval.
      - run: pytest
      - uses: actions/cache@v6
        with:
          path: backend/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      # Quality gate: fail if retrieval gets worse (bge-small ranks the right document first for
      # 96% of the demo questions; see README "Retrieval quality").
      - run: python -m evals.retrieval.run --cache-dir .cache/fastembed --fail-under 0.85

  web:
    name: web (React, TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build   # includes the TypeScript type check

  security-scan:
    name: Security scan (dependencies, secrets, misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  docker-images:
    name: Build container images
    needs: [backend, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t eka/backend:ci backend
      - run: docker build -t eka/web:ci web
