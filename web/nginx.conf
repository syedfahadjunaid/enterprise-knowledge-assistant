# Serves the built single-page app and forwards /api to the backend, so the browser only ever
# talks to one origin.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Security headers. "always" also adds them to error responses.
    # CSP: scripts and styles only from this origin (no inline code), API calls only to this
    # origin and Keycloak, and the app can't be framed (clickjacking).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8380; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Streamed answers (server-sent events): pass every chunk through immediately.
    location = /api/ask {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;   # long answers can take a while
        client_max_body_size 16k;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 21m;  # uploads: the API allows 20 MB files
        proxy_read_timeout 60s;
    }

    # Built files have content hashes in their names, so they can be cached forever.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Anything else is a client-side route: serve index.html, and never cache it,
    # so users always get the latest build.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
