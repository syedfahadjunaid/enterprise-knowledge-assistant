[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eka-backend"
version = "0.1.0"
description = "Enterprise knowledge assistant: permission-aware retrieval-augmented answers over internal documents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.11",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",   # multipart/form-data parsing for file uploads
    "pyjwt[crypto]>=2.10",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3",
    "numpy>=2.0",
    "redis>=5.2",
    "anthropic>=2.12,<3",
    "fastembed>=0.9,<1",          # local embedding models on ONNX Runtime (no PyTorch, no GPU)
    # Document parsers, one per supported format
    "pypdf>=5.0",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.27",          # used by FastAPI's TestClient
    "ruff>=0.8",
    "testcontainers>=4.8",  # real Postgres + pgvector in Docker for integration tests
    "fpdf2>=2.8",           # builds small PDFs for parser tests and the demo documents
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs Docker (Testcontainers); skipped automatically if Docker isn't running",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/script.py.mako"]

[tool.ruff.lint]
# E/F: errors, I: import order, B: bug-prone patterns, UP: modern syntax,
# S: security (bandit rules), SIM: simplifications, ASYNC: blocking calls in async code
select = ["E", "F", "I", "B", "UP", "S", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]   # assert is how pytest works; tests use fake secrets
"evals/**" = ["S101"]
