# Local stack for the Enterprise Knowledge Assistant.
#
#   docker compose up -d --build     -> everything; open http://localhost:5380
#   docker compose up -d postgres keycloak redis   -> infrastructure only (run the API from backend/)
#
# All ports are bound to 127.0.0.1 so nothing is reachable from your network.
# Secrets come from .env (copy .env.example -> .env). Nothing has a default password.
# Ports are deliberately unusual (5380, 8300, 8380, 25432, 26379) so this stack can run next
# to other local projects.

name: eka

x-backend-db: &backend-db
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: eka

x-oidc: &oidc
  # Tokens always say iss=http://localhost:8380/realms/eka (the URL the browser uses), but the
  # backend fetches the signing keys over the internal Docker network.
  OIDC_ISSUER: http://localhost:8380/realms/eka
  OIDC_JWKS_URL: http://keycloak:8080/realms/eka/protocol/openid-connect/certs

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_DB: eka
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?copy .env.example to .env}
      # Used once by infra/postgres/init/01-init.sh to create the application logins
      EKA_OWNER_DB_PASSWORD: ${EKA_OWNER_DB_PASSWORD:?copy .env.example to .env}
      EKA_APP_DB_PASSWORD: ${EKA_APP_DB_PASSWORD:?copy .env.example to .env}
      EKA_WORKER_DB_PASSWORD: ${EKA_WORKER_DB_PASSWORD:?copy .env.example to .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?copy .env.example to .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-25432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 forces TCP, so this only passes once the init script has finished
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d eka"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?copy .env.example to .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?copy .env.example to .env}
      KC_HOSTNAME: http://localhost:8380
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8380:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The Keycloak image has no curl, so talk HTTP to the management port with bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      # The first start builds Keycloak's optimized server and imports the realm. That takes
      # ~30 s on an idle machine but several minutes on a busy one; failed checks during the
      # start period don't count, so a slow first start doesn't fail `docker compose up`.
      start_period: 300s
    restart: unless-stopped

  redis:
    image: redis:8.8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?copy .env.example to .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-26379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: applies the Alembic migrations as the schema owner, then exits.
  migrate:
    build: ./backend
    image: eka/backend:local
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-db
      EKA_OWNER_DB_PASSWORD: ${EKA_OWNER_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    image: eka/backend:local
    environment:
      <<: [*backend-db, *oidc]
      EKA_APP_DB_PASSWORD: ${EKA_APP_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:8300:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Background ingestion: parses, chunks and embeds uploaded documents (see app/ingestion).
  worker:
    build: ./backend
    image: eka/backend:local
    command: ["python", "-m", "app.ingestion.worker"]
    environment:
      <<: *backend-db
      EKA_WORKER_DB_PASSWORD: ${EKA_WORKER_DB_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: ./web
    # Port 5380 is the redirect URI registered for the eka-web client in Keycloak.
    # Stop this container (docker compose stop web) when running "npm run dev" instead.
    ports:
      - "127.0.0.1:5380:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
